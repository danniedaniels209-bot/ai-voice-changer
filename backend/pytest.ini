[pytest]
# Registered so `-m "not slow"` works and unknown-marker warnings stay quiet.
#
# slow: drives a real headless browser and/or ffmpeg end to end. Currently
#   just the journey test, which is deliberately the slowest thing here —
#   it's the only test that exercises the seams between the editor, the
#   renderer and the encoder, which is where every serious bug in Motion
#   Studio has actually lived. Run the fast suite with:
#       pytest -m "not slow"
markers =
    slow: end-to-end test that runs a real browser and/or ffmpeg
